  <path d="M 48 24 C 50 10 60 10 62 24 Z" fill="#ffba08"/>

  <!-- Body -->
  <ellipse cx="55" cy="58" rx="34" ry="32" fill="url(#harpyBody)" stroke="#370617" stroke-width="4.5"/>

  <!-- Underbelly Shading -->
