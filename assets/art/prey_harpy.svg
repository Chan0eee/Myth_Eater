  </defs>

  <!-- Wing Left -->
  <path d="M 22 55 C 4 36 2 64 18 72 C 6 74 12 86 28 80 Z" fill="url(#harpyWing)" stroke="#370617" stroke-width="4" stroke-linejoin="round"/>
  <!-- Wing Right -->
