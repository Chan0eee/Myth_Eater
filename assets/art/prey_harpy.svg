  <circle cx="42" cy="54" r="10" fill="#ffffff" stroke="#370617" stroke-width="3.5"/>
  <circle cx="42" cy="54" r="6" fill="#03045e"/>
  <circle cx="40" cy="51" r="2.5" fill="#ffffff"/>

  <circle cx="68" cy="54" r="10" fill="#ffffff" stroke="#370617" stroke-width="3.5"/>
  <circle cx="68" cy="54" r="6" fill="#03045e"/>
  <circle cx="66" cy="51" r="2.5" fill="#ffffff"/>

  <!-- Golden Beak -->
  <polygon points="49,58 61,58 55,69" fill="#ffba08" stroke="#370617" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="33" cy="63" r="4" fill="#e63946" opacity="0.5"/>
  <circle cx="77" cy="63" r="4" fill="#e63946" opacity="0.5"/>
