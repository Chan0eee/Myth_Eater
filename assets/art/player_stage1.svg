<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bodyGrad1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a2282"/>
      <stop offset="45%" stop-color="#2c1055"/>
      <stop offset="100%" stop-color="#15062c"/>
    </radialGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#240046"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Wing-fins -->
  <path d="M 22 72 C 6 62 10 44 26 56 Z" fill="#00f5d4" stroke="#120624" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 106 72 C 122 62 118 44 102 56 Z" fill="#00f5d4" stroke="#120624" stroke-width="4" stroke-linejoin="round"/>

  <!-- Horns -->
  <path d="M 40 40 C 32 18 20 22 28 8 C 42 16 48 28 46 42 Z" fill="url(#hornGrad)" stroke="#120624" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M 88 40 C 96 18 108 22 100 8 C 86 16 80 28 82 42 Z" fill="url(#hornGrad)" stroke="#120624" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Main Body -->
  <ellipse cx="64" cy="68" rx="42" ry="40" fill="url(#bodyGrad1)" stroke="#120624" stroke-width="5"/>

  <!-- Cel Shading Shadow -->
  <path d="M 26 78 C 34 102 94 102 102 78 C 96 106 32 106 26 78 Z" fill="#0b0217" opacity="0.6"/>

  <!-- Glossy Highlight -->
  <ellipse cx="48" cy="46" rx="14" ry="7" transform="rotate(-25 48 46)" fill="#ffffff" opacity="0.65"/>
  <circle cx="34" cy="52" r="3" fill="#ffffff" opacity="0.75"/>

  <!-- Void markings (dots) -->
  <circle cx="64" cy="94" r="3.5" fill="#00f5d4"/>
  <circle cx="52" cy="91" r="2.5" fill="#00f5d4"/>
  <circle cx="76" cy="91" r="2.5" fill="#00f5d4"/>

  <!-- Eyes -->
  <!-- Left Eye -->
  <ellipse cx="46" cy="64" rx="13" ry="15" fill="#ffbe0b" stroke="#120624" stroke-width="4"/>
  <ellipse cx="46" cy="64" rx="7" ry="10" fill="#120624"/>
  <circle cx="43" cy="60" r="4.5" fill="#ffffff"/>
  <circle cx="49" cy="68" r="2" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="82" cy="64" rx="13" ry="15" fill="#ffbe0b" stroke="#120624" stroke-width="4"/>
  <ellipse cx="82" cy="64" rx="7" ry="10" fill="#120624"/>
  <circle cx="79" cy="60" r="4.5" fill="#ffffff"/>
  <circle cx="85" cy="68" r="2" fill="#ffffff"/>

  <!-- Toothy cute mouth -->
  <path d="M 52 80 Q 64 92 76 80 Z" fill="#e63946" stroke="#120624" stroke-width="4" stroke-linejoin="round"/>
  <!-- Little Fangs -->
  <polygon points="56,80 59,85 62,80" fill="#ffffff"/>
  <polygon points="66,80 69,85 72,80" fill="#ffffff"/>
</svg>
