<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="houndFur" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#312244"/>
      <stop offset="55%" stop-color="#1d1128"/>
      <stop offset="100%" stop-color="#0a0510"/>
    </radialGradient>
    <linearGradient id="fireMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="50%" stop-color="#ff0054"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>
    <radialGradient id="houndEye" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fffb00"/>
      <stop offset="40%" stop-color="#ff0054"/>
      <stop offset="100%" stop-color="#590019"/>
    </radialGradient>
    <linearGradient id="ironCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#555b6e"/>
      <stop offset="50%" stop-color="#2f3e46"/>
      <stop offset="100%" stop-color="#1b262c"/>
    </linearGradient>
  </defs>

  <!-- Fiery Spiky Mane (Back/Behind) -->
  <path d="M 44 48 C 24 20 40 4 60 18 C 72 6 92 6 98 22 C 112 8 132 16 126 38 C 146 28 158 48 142 66 Z" fill="url(#fireMane)" stroke="#0a0510" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- Jagged Demonic Hound Ears -->
  <polygon points="38,62 18,18 56,42" fill="url(#houndFur)" stroke="#0a0510" stroke-width="5.5" stroke-linejoin="round"/>
  <polygon points="34,54 26,28 48,42" fill="#ff0054" opacity="0.8"/>

  <polygon points="142,62 162,18 124,42" fill="url(#houndFur)" stroke="#0a0510" stroke-width="5.5" stroke-linejoin="round"/>
  <polygon points="146,54 154,28 132,42" fill="#ff0054" opacity="0.8"/>

  <!-- Broad Demonic Canine Torso -->
  <ellipse cx="90" cy="126" rx="58" ry="42" fill="url(#houndFur)" stroke="#0a0510" stroke-width="6"/>

  <!-- Spiked Iron Collar -->
  <path d="M 36 102 C 54 122 126 122 144 102 C 130 90 50 90 36 102 Z" fill="url(#ironCollar)" stroke="#0a0510" stroke-width="5.5" stroke-linejoin="round"/>
  <!-- Iron Collar Spikes -->
  <polygon points="44,106 32,122 52,114" fill="#f0ece1" stroke="#0a0510" stroke-width="3"/>
  <polygon points="72,114 68,132 82,117" fill="#f0ece1" stroke="#0a0510" stroke-width="3"/>
  <polygon points="108,114 112,132 98,117" fill="#f0ece1" stroke="#0a0510" stroke-width="3"/>
  <polygon points="136,106 148,122 128,114" fill="#f0ece1" stroke="#0a0510" stroke-width="3"/>

  <!-- Massive Chibi Hound Head -->
  <circle cx="90" cy="74" r="44" fill="url(#houndFur)" stroke="#0a0510" stroke-width="6"/>

  <!-- Under-jaw Shading -->
  <path d="M 52 86 C 68 108 112 108 128 86 C 120 114 60 114 52 86 Z" fill="#040208" opacity="0.6"/>

  <!-- Glossy Head Highlight -->
  <ellipse cx="70" cy="50" rx="14" ry="7" transform="rotate(-25 70 50)" fill="#ffffff" opacity="0.55"/>
  <circle cx="56" cy="58" r="3" fill="#ffffff" opacity="0.7"/>

  <!-- Glowing Magma Eyes -->
  <!-- Left Eye -->
  <polygon points="46,62 70,58 66,74 48,72" fill="url(#houndEye)" stroke="#0a0510" stroke-width="4.5" stroke-linejoin="round"/>
  <circle cx="58" cy="65" r="3" fill="#ffffff"/>
  <!-- Right Eye -->
  <polygon points="134,62 110,58 114,74 132,72" fill="url(#houndEye)" stroke="#0a0510" stroke-width="4.5" stroke-linejoin="round"/>
  <circle cx="122" cy="65" r="3" fill="#ffffff"/>

  <!-- Snarling Demonic Snout -->
  <ellipse cx="90" cy="80" rx="20" ry="14" fill="#150a21" stroke="#0a0510" stroke-width="4"/>
  <ellipse cx="90" cy="74" rx="8" ry="5" fill="#ff0054"/>

  <!-- Snarl Fangs & Mouth -->
  <path d="M 70 88 Q 90 98 110 88" stroke="#0a0510" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Sharp Fangs -->
  <polygon points="74,88 78,100 82,88" fill="#ffffff" stroke="#0a0510" stroke-width="2.5"/>
  <polygon points="84,89 88,97 92,89" fill="#ffffff" stroke="#0a0510" stroke-width="2"/>
  <polygon points="98,89 102,97 106,89" fill="#ffffff" stroke="#0a0510" stroke-width="2"/>
  <polygon points="108,88 102,100 96,88" fill="#ffffff" stroke="#0a0510" stroke-width="2.5"/>
</svg>
